---
- name: Check which packages Certbot can use
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${Package} ${db:Status-Status}\n'
      - snapd
      - apache2
      - nginx
    expand_argument_vars: false
  register: certbot_packages
  failed_when: certbot_packages.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Package snapd is present
  ansible.builtin.apt:
    pkg: snapd
    state: present
  when: "'snapd installed' not in certbot_packages.stdout_lines"

- name: Snap package certbot is present
  community.general.snap:
    name: certbot
    state: present
    classic: true

- name: Select the default Certbot web server plugin
  ansible.builtin.set_fact:
    certbot_default_plugin: "{{ '--nginx' if 'nginx installed' in certbot_packages.stdout_lines else '--apache' }}"
  when: >-
    'nginx installed' in certbot_packages.stdout_lines or
    'apache2 installed' in certbot_packages.stdout_lines

- name: Certificates are present
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --noninteractive
      - --agree-tos
      - --email
      - "{{ admin_email }}"
      - "{{ (certbot_plugin | default(certbot_default_plugin)) | mandatory(msg='Set certbot_plugin or install Nginx or Apache') }}"
      - -d
      - "{{ item }}"
    creates: "/etc/letsencrypt/live/{{ item.split(',')[0] }}/cert.pem"
  loop: "{{ certbot_certificates | default([]) | flatten(1, skip_nulls=false) }}"
